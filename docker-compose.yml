# Provenance allowlist for the analyst-facing read surface (briefing-generator
# selection). Only entities authored by these identities rank; mass commodity
# publishers stay in the platform for lookup/enrichment but never crowd the
# analyst surface.
# Exact createdBy display names, comma-separated.
x-curated-authors: &curated-authors
  CURATED_AUTHORS=AlienVault,The MITRE Corporation,CIRCL,CERT-FR,CERT-FR_1510,ESET,Ransom-ISAC,Centro Nacional de Seguridad Digital (CNSD),Grupo de Respuesta a Emergencias Ciberneticas de Colombia (ColCERT)

networks:
  tim-network:
    driver: bridge

volumes:
  esdata:
    name: ${ESDATA_VOLUME_NAME:-opencti-7-pilot_esdata}
    external: ${ESDATA_VOLUME_EXTERNAL:-false}
  redisdata:
  rabbitmqdata:
  miniodata:
  briefingsdata:
  extractordata:
  # P1.1: fs repository for ES snapshot API — scripts/backup.sh snapshots here,
  # then tars this volume out like the rest. Named volume (not bind) so ES's
  # uid-1000 process can write without host chown games.
  esbackups:

# ─────────────────────────────────────────────
# CAPA DE PLATAFORMA — OpenCTI + dependencias
# ─────────────────────────────────────────────

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: [core]
    environment:
      - discovery.type=single-node
      # AUDIT (accepted risk, single-host scope): ES security is disabled, so any container on
      # tim-network can read/write the index unauthenticated. ES has no host port. Enabling
      # xpack.security requires bootstrap creds wired into OpenCTI + kibana + feed-orchestrator.
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms8g -Xmx8g
      - cluster.routing.allocation.disk.threshold_enabled=false
      # P1.1: snapshot repo path for scripts/backup.sh (ES rejects fs repos
      # whose location is not under path.repo).
      - path.repo=/backups
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - esbackups:/backups
    mem_limit: 12g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - tim-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    profiles: [core]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    # no host port — access via soc-dashboard nginx on :5602 with basic auth
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    profiles: [core]
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEM_LIMIT:-2g}
    # Persistencia por AOF, sin instantáneas RDB. Las instantáneas se quitaron cuando el fork de
    # bgsave agotaba la memoria con ~1 GB de datos bajo el tope antiguo de 1 GB. Sin persistencia,
    # cada reinicio del host dejaba Redis vacío: se perdían tim:ioc_seen (deduplicación de 24 h), el
    # estado de los feeds y las sesiones de OpenCTI, y los 12 feeds volvían a crear por la API lo ya
    # enviado (el 2026-09-20, ~4 000 claves reconstruidas en 40 min; el upsert evita duplicados, no el
    # trabajo). Hoy el stream está acotado por REDIS__TRIMMING (200k eventos) y el tope es de 2-3 GB,
    # así que el fork de la reescritura del AOF cabe. appendfsync queda en everysec: se pierde como mucho 1 s, y el upsert
    # de OpenCTI cubre ese resto.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1536mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tim-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [core]
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"   # management UI — localhost only
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - tim-network
    restart: unless-stopped

  minio:
    # AUDIT: pin to your tested release for reproducibility, e.g.
    #   docker inspect --format '{{index .RepoDigests 0}}' minio/minio:latest
    # then replace :latest with minio/minio@sha256:<digest>. Left as :latest to avoid
    # changing the image out from under a running deployment.
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"     # consola web — localhost only
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tim-network
    restart: unless-stopped

  opencti:
    image: opencti/platform:7.260706.0
    profiles: [core]
    environment:
      - NODE_OPTIONS=--max-old-space-size=3072
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${APP__ENCRYPTION_KEY}
      - APP__APP_LOGS__LOGS_LEVEL=error
      - APP__SESSION_TIMEOUT=28800000   # 8 horas
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      # Nodo unico: una replica nunca puede asignarse (no hay segundo nodo donde
      # ponerla) y el cluster se queda en yellow para siempre, inutilizando "green"
      # como señal de salud. Filigran lo fija a 0 en su propio compose.
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      # El defecto de la plataforma (2M eventos) nunca llega a dispararse: el
      # maxmemory de Redis (2 GB) se llena a los ~1,2M y noeviction bloquea las
      # escrituras — incluidas las sesiones de la UI ("Too many pending tasks in
      # queue sess:..."). 200k eventos ≈ 300 MB deja 1,7 GB de margen.
      - REDIS__TRIMMING=200000
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO__SECRET_KEY=${MINIO_SECRET_KEY}
      - APP__TELEMETRY__METRICS__ENABLED=true
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 4g
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - tim-network
    restart: unless-stopped

  worker:
    image: opencti/worker:7.260706.0
    profiles: [core]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - WORKER_LOG_LEVEL=error
    mem_limit: 512m
    depends_on:
      opencti:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tim-network
    restart: unless-stopped

  # Conector MITRE ATT&CK — carga el framework completo en OpenCTI al iniciar
  connector-mitre:
    image: opencti/connector-mitre:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_NAME=MITRE ATT&CK
      - CONNECTOR_SCOPE=marking-definition,identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool,report
      - CONNECTOR_UPDATE_EXISTING_DATA=true
      - CONNECTOR_RUN_AND_TERMINATE=false
      - MITRE_REMOVE_STATEMENT_MARKING=true
      - MITRE_INTERVAL=7
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython -m src' || exit 1"]  # 7.x runs `python -m src`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  # Conector OpenCTI Datasets — catálogo de referencia: 250 países (245 con
  # lat/long e ISO real) y el árbol de sectores. Pareja de connector-mitre en el
  # compose de referencia del vendor; faltaba aquí. Sin él, las fuentes que crean
  # países por nombre (AlienVault: country="ZZ", sin coordenadas) dejan entidades
  # inubicables en los widgets de mapa. Location.generate_id(name,"Country") deriva
  # el ID del nombre, así que catálogo y fuente se funden y gana la geometría.
  # Sí crea relaciones, pero solo estructurales: 266 located-at (país→región,
  # región→región, geoesquema ONU) y 80 part-of (jerarquía de sectores). Ninguna
  # atribución de inteligencia — no dice quién ataca a quién.
  # CONNECTOR_ID literal (no es secreto y .env no se toca).
  connector-opencti:
    image: opencti/connector-opencti:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID:-ae6c030b-0d42-46d1-8893-56930f5dca70}
      - CONNECTOR_NAME=OpenCTI Datasets
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_CONFIDENCE_LEVEL=100
      - CONNECTOR_UPDATE_EXISTING_DATA=true
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_LOG_LEVEL=error
      - CONFIG_SECTORS_FILE_URL=https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/sectors.json
      - CONFIG_GEOGRAPHY_FILE_URL=https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/geography.json
      - CONFIG_REMOVE_CREATOR=false
      - CONFIG_INTERVAL=7
    mem_limit: 512m
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  connector-ipinfo:
    image: opencti/connector-ipinfo:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_IPINFO_ID}
      - CONNECTOR_NAME=IpInfo
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr
      # false: 50k consultas/mes gratis contra decenas de miles de IPs de feeds
      # a granel — la misma aritmetica de cuota que virustotal (500/dia), solo
      # que mas lenta en morir. El true era herencia del piloto con poco volumen.
      # Disparador para reevaluar: telemetria propia (flujo pequeño y valioso).
      - CONNECTOR_AUTO=false
      - CONNECTOR_CONFIDENCE_LEVEL=75
      - CONNECTOR_LOG_LEVEL=error
      - IPINFO_TOKEN=${IPINFO_TOKEN}
      - IPINFO_MAX_TLP=TLP:AMBER
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython -m src' || exit 1"]  # 7.x runs `python -m src`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  connector-cve:
    build: ./services/connector-cve
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_CVE_ID}
      - CONNECTOR_NAME=Common Vulnerabilities and Exposures
      - CONNECTOR_SCOPE=vulnerability
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_LOG_LEVEL=error
      - CVE_BASE_URL=https://services.nvd.nist.gov/rest/json/cves
      - CVE_API_KEY=${CVE_NVD_API_KEY}
      - CVE_INTERVAL=2
      - CVE_MAX_DATE_RANGE=2
      - CVE_MAINTAIN_DATA=true
      - CVE_PULL_HISTORY=true
      # 2019 es el suelo del propio conector, no una ventana arbitraria: CVSS v3.1 salió
      # en junio de 2019 y las CVE anteriores casi nunca traen cvssMetricV31. Bajar de
      # aquí mete decenas de miles de vulnerabilidades sin puntuación de severidad —
      # entidades flacas, sin el campo por el que se priorizan. NVD tiene 372.835 CVEs
      # en total (medido 2026-08-03); esto trae las que llegan con datos completos.
      - CVE_HISTORY_START_YEAR=2019
      # import_software (CPE → objetos Software + relaciones 'has') queda en su default
      # False a propósito: cada CVE resuelve a decenas de CPEs. Sin él este conector
      # produce solo Vulnerability + la Identity de NIST NVD — cero observables, cero
      # indicadores, cero relaciones. Verificado en el código del convertidor.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython -m src' || exit 1"]  # 7.x runs `python -m src`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_CISA_KEV_ID}
      - CONNECTOR_NAME=CISA Known Exploited Vulnerabilities
      - CONNECTOR_SCOPE=vulnerability
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CISA_CATALOG_URL=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      - CISA_CREATE_INFRASTRUCTURES=false
      - CISA_TLP=TLP:CLEAR
      - CISA_INTERVAL=7
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython.*main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  connector-misp-feed:
    image: opencti/connector-misp-feed:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_MISP_FEED_ID}
      - CONNECTOR_NAME=CIRCL OSINT Feed
      - CONNECTOR_SCOPE=misp-feed
      - CONNECTOR_LOG_LEVEL=error
      - MISP_FEED_INTERVAL=1440
      - MISP_FEED_SOURCE_TYPE=url
      - MISP_FEED_URL=https://www.circl.lu/doc/misp/feed-osint/
      - MISP_FEED_SSL_VERIFY=true
      # Curado tras el accidente del 5-ago (L05 §8): 575k mensajes con la config
      # anterior (ventana 2025-01-01 + todos los CREATE_* abiertos). CIRCL es un
      # feed denso: cada atributo se multiplicaba por observable + indicador +
      # objeto-observable + relaciones. Ventana a 3 meses y solo indicadores:
      # ~90k mensajes estimados en vez de 600k+. Los observables pueden crearse
      # despues via enriquecedores, solo para lo que importe.
      - MISP_FEED_IMPORT_FROM_DATE=2026-05-01
      - MISP_FEED_CREATE_REPORTS=true
      - MISP_FEED_CREATE_INDICATORS=true
      - MISP_FEED_CREATE_OBSERVABLES=false
      - MISP_FEED_CREATE_OBJECT_OBSERVABLES=false
      - MISP_FEED_CREATE_TAGS_AS_LABELS=true
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython3 main.py' || exit 1"]  # 7.x entrypoint runs `python3 main.py`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  # CERT-FR public MISP feed — same connector image as CIRCL, different instance.
  connector-misp-feed-certfr:
    image: opencti/connector-misp-feed:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_MISP_FEED_CERTFR_ID:-97bc9a57-0a28-413d-b5ab-d298aeae7081}
      - CONNECTOR_NAME=MISP Feed CERT-FR
      - CONNECTOR_SCOPE=misp-feed
      - CONNECTOR_LOG_LEVEL=error
      - MISP_FEED_INTERVAL=1440
      - MISP_FEED_SOURCE_TYPE=url
      - MISP_FEED_URL=https://misp.cert.ssi.gouv.fr/feed-misp/
      - MISP_FEED_SSL_VERIFY=true
      # Mismo curado que CIRCL (L05 §8) para mantener el modelo de datos
      # consistente entre fuentes MISP. CERT-FR es un feed pequeno; el motivo
      # aqui no es el volumen sino la simetria.
      - MISP_FEED_IMPORT_FROM_DATE=2026-05-01
      - MISP_FEED_CREATE_REPORTS=true
      - MISP_FEED_CREATE_INDICATORS=true
      - MISP_FEED_CREATE_OBSERVABLES=false
      - MISP_FEED_CREATE_OBJECT_OBSERVABLES=false
      - MISP_FEED_CREATE_TAGS_AS_LABELS=true
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython3 main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  # DISARM framework dataset (disinformation TTPs) — one-shot import + periodic refresh.
  connector-disarm-framework:
    image: opencti/connector-disarm-framework:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_DISARM_ID:-da1bbfbb-ad68-4b05-8c06-6eb510f50584}
      - CONNECTOR_NAME=DISARM Framework
      - CONNECTOR_SCOPE=marking-definition,identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool,report,narrative,event,channel
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_LOG_LEVEL=error
      - DISARM_FRAMEWORK_URL=https://raw.githubusercontent.com/DISARMFoundation/DISARMframeworks/main/generated_files/DISARM_STIX/DISARM.json
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython3 main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  # Enrichment tier — flags benign/known-good observables via MISP warninglists (local lists, no external API).
  connector-hygiene:
    image: opencti/connector-hygiene:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_HYGIENE_ID:-320bee0b-63d6-4049-bb32-e8f7fca921bf}
      - CONNECTOR_NAME=Hygiene
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr,Domain-Name,StixFile,Artifact
      - CONNECTOR_AUTO=true
      - CONNECTOR_LOG_LEVEL=error
      - HYGIENE_MAX_WORKERS=10
      - HYGIENE_LABEL=hygiene
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython -m src' || exit 1"]  # this image's entrypoint is `python -m src`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

  # Enrichment — EPSS exploit-probability score on vulnerabilities (FIRST.org public API, no key).
  # CONNECTOR_AUTO=false: 88k vulns on auto would hammer the API; enrich on demand from the UI.
  connector-first-epss:
    image: opencti/connector-first-epss:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_FIRST_EPSS_ID:-12f3d992-2317-4cc6-b2d9-7e4319d6e6b7}
      - CONNECTOR_NAME=First EPSS
      - CONNECTOR_SCOPE=vulnerability
      - CONNECTOR_AUTO=false
      - CONNECTOR_LOG_LEVEL=error
      - FIRST_EPSS_API_BASE_URL=https://api.first.org/data/v1/epss
      - FIRST_EPSS_MAX_TLP=TLP:AMBER
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython3 main.py' || exit 1"]
      interval: 30s
      timeout: 10s
