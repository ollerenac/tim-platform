    profiles: [feeds]
    ports:
      # Host port 8005 (container still listens on 8001): 8001 is taken on this
      # host by claude-science. Internal network access stays feed-orchestrator:8001.
      - "127.0.0.1:8005:8001"
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - ES_URL=http://elasticsearch:9200
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY}
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY}
      - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
    mem_limit: 1g
    depends_on:
      opencti:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ponytail: python stdlib probe — curl not available in python:3.12-slim
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tim-network
    restart: unless-stopped

# ─────────────────────────────────────────────
# CAPA AI — Servicios custom Python
# ─────────────────────────────────────────────

  intel-extractor:
    build: ./services/intel-extractor
    profiles: [extractor]
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      # decision-llm 2026-08-10 (rev. bedrock): claude via Amazon Bedrock, prompt
      # v2.1. Auth = EC2 instance IAM role — no API key anywhere. Bedrock is the
      # only provider since 2026-09-19 (fixed in the service, not configurable).
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      # Incident 2026-08-10: collector auto-extraction burned API credit on a
      # fresh volume. Opt-in only — default is manual /extract API alone.
      - COLLECTOR_ENABLED=${COLLECTOR_ENABLED:-false}
      - DB_PATH=/data/stats.db
    volumes:
      - extractordata:/data
    mem_limit: 1g
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped
    healthcheck:
      # ponytail: python stdlib probe — curl not available in python:3.12-slim
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  briefing-generator:
    build: ./services/briefing-generator
    profiles: [briefings]
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_CONNECTORS_TOKEN:-${OPENCTI_ADMIN_TOKEN}}
      - PYTHONUNBUFFERED=1
      # Claude haiku vía Amazon Bedrock con el rol IAM de la instancia (único proveedor).
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      - DB_PATH=/data/briefings.db
      - *curated-authors
    volumes:
      - briefingsdata:/data
    mem_limit: 1g
    depends_on:
      opencti:
        condition: service_healthy
        # Sintetizador 2026-08-19: con `--profile briefings` solo, opencti (profile
        # core) queda indefinido — required:false deja arrancar; opencti ya corre
        # en el proyecto y el healthcheck del servicio cubre el arranque en frío.
        required: false
    healthcheck:
      # ponytail: python stdlib probe — curl not available in python:3.12-slim
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tim-network
    restart: unless-stopped

# ─────────────────────────────────────────────
# CAPA DE PRESENTACIÓN — SOC Dashboard
# ─────────────────────────────────────────────

  soc-dashboard:
    build: ./services/dashboard
    profiles: [dashboard]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:5602:5602"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./services/dashboard/.kibana.htpasswd:/etc/nginx/.kibana.htpasswd:ro
    mem_limit: 512m
    depends_on:
      feed-orchestrator:
        condition: service_healthy
      briefing-generator:
        condition: service_healthy
      kibana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && pgrep -f '[n]ginx: master' && wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tim-network
    restart: unless-stopped
