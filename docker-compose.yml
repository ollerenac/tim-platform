  # PULL-only connector (imports OTX pulses) — no data-sovereignty exception needed.
  # Pulses carry actor+malware+CVE+ATT&CK as explicit STIX relationships with RECENT
  # dates — the fresh-semantics source the 3-month dashboard widgets consume.
  connector-alienvault:
    image: opencti/connector-alienvault:7.260706.0
    profiles: [connectors]
    environment:
      - OPENCTI_URL=http://opencti:8080
      # Dedicated service account (max confidence 80, no admin Bypass): OTX community
      # data loses ties against MITRE (100), stopping the hourly clobber of
      # attack-pattern names with bare IDs like "T1095". CONNECTOR_CONFIDENCE_LEVEL
      # proved a no-op under an admin token — confidence comes from the token's user.
      - OPENCTI_TOKEN=${OPENCTI_ALIENVAULT_TOKEN}
      - PYTHONUNBUFFERED=1
      - CONNECTOR_ID=${CONNECTOR_ALIENVAULT_ID}
      - CONNECTOR_NAME=AlienVault
      - CONNECTOR_SCOPE=alienvault
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_DURATION_PERIOD=PT1H
      - ALIENVAULT_BASE_URL=https://otx.alienvault.com
      - ALIENVAULT_API_KEY=${ALIENVAULT_API_KEY}
      - ALIENVAULT_TLP=White
      - ALIENVAULT_CREATE_OBSERVABLES=true
      - ALIENVAULT_CREATE_INDICATORS=true
      # Bounded backfill window; the 2020 default would be hundreds of thousands
      # of pulses drowning the worker for days. Moved 2026-04-17 -> 2026-03-01
      # (2026-07-27) to recapture official pulses lost to crash-induced cursor
      # gaps (May + mid-June holes, e.g. the Handala/Void Manticore pulses).
      - ALIENVAULT_PULSE_START_TIMESTAMP=2026-03-01T00:00:00
      - ALIENVAULT_REPORT_TYPE=threat-report
      - ALIENVAULT_REPORT_STATUS=New
      # Anti-invention policy: only relationships the pulse explicitly declares —
      # never guessed from tags (matches the extractor's literal-grounding rule).
      - ALIENVAULT_GUESS_MALWARE=false
      - ALIENVAULT_GUESS_CVE=false
      - ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES=FileHash-MD5,FileHash-SHA1
      - ALIENVAULT_ENABLE_RELATIONSHIPS=true
      - ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES=true
      # false (official default): keep IOCs older than the latest pulse — a 2025
      # hash cited in a fresh pulse is still valid; true would drop them mid-backfill.
      - ALIENVAULT_FILTER_INDICATORS=false
      - ALIENVAULT_DEFAULT_X_OPENCTI_SCORE=50
    # 1g OOM-killed the connector 48x in a row during the 2026-03-01 window
    # backfill (5 months of official pulses fetched in one run); 4g lets the
    # full-catalog fetch complete so the cursor can finally advance.
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]ython __main__.py' || exit 1"]  # entrypoint.sh runs `python __main__.py`
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - tim-network
    restart: unless-stopped

# ─────────────────────────────────────────────
