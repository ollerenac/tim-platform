# Objetivo AWS: nodo sin GPU. Toda generación va a Amazon Bedrock por rol IAM
# de instancia — sin claves en disco. Ollama no se despliega: el perfil
# inference no forma parte de este objetivo (ver scripts/compose-target.sh).
#
# Uso (siempre junto a la base):
#   ./scripts/tim-check.sh aws
#   $(./scripts/compose-target.sh aws) up -d
#
# Los proveedores están fijados aquí, no heredados del entorno: el objetivo
# define la semántica y cambiarla exige editar este fichero versionado.

services:
  intel-extractor:
    environment:
      - LLM_PROVIDER=bedrock

  briefing-generator:
    environment:
      - LLM_PROVIDER=bedrock
