services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:84a73ced8390c059e7bc2858595c68dc36e6f8bdb98895dcab0074eda35ac96e
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms1536m -Xmx1536m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    command: ["redis-server", "--save", "", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: timexp
      RABBITMQ_DEFAULT_PASS: timexp-exp01-only
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: timexp
      MINIO_ROOT_PASSWORD: timexp-exp01-only
    volumes:
      - miniodata:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  opencti:
    image: opencti/platform@sha256:61ae09dbde9edf1d8d03d3807e43f66d8a42dba4e6c92dc0308ce0634fb34f32
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      APP__PORT: "8080"
      APP__BASE_URL: http://127.0.0.1:18080
      APP__ADMIN__EMAIL: admin@timexp.local
      APP__ADMIN__PASSWORD: TimExp-Only-2026!
      APP__ADMIN__TOKEN: 99999999-9999-4999-8999-999999999999
      APP__ENCRYPTION_KEY: timexp-exp01-local-only-encryption-key-2026
      APP__APP_LOGS__LOGS_LEVEL: error
      APP__TELEMETRY__METRICS__ENABLED: "false"
      ELASTICSEARCH__URL: http://elasticsearch:9200
      ELASTICSEARCH__NUMBER_OF_REPLICAS: "0"
      REDIS__HOSTNAME: redis
      REDIS__PORT: "6379"
      REDIS__TRIMMING: "10000"
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: "5672"
      RABBITMQ__USERNAME: timexp
      RABBITMQ__PASSWORD: timexp-exp01-only
      MINIO__ENDPOINT: minio
      MINIO__PORT: "9000"
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: timexp
      MINIO__SECRET_KEY: timexp-exp01-only
    ports:
      - 127.0.0.1:18080:8080
    mem_limit: 3g
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  worker:
    image: opencti/worker@sha256:73c5bf30ca841775701872e81c78d33ed28d3d26f7586c2dfba45797038c4ab0
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: 99999999-9999-4999-8999-999999999999
      WORKER_LOG_LEVEL: error
      PYTHONUNBUFFERED: "1"
    mem_limit: 768m
    depends_on:
      opencti:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*worker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  harness:
    image: opencti/worker@sha256:73c5bf30ca841775701872e81c78d33ed28d3d26f7586c2dfba45797038c4ab0
    profiles: [tools]
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: 99999999-9999-4999-8999-999999999999
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: timexp
      RABBITMQ_PASSWORD: timexp-exp01-only
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/experiment:ro
      - ./runs:/runs
    entrypoint: ["python", "/experiment/runtime.py"]
    depends_on:
      opencti:
        condition: service_healthy

volumes:
  esdata: {}
  redisdata: {}
  rabbitmqdata: {}
  miniodata: {}
