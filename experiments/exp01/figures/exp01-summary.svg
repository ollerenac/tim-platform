<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Resumen del experimento EXP-01</title>
  <desc id="description">Flujo experimental y resultados agregados de tres réplicas de importación, replay y recuperación del worker.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#10263b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d4f5"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#53c9e8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1480" cy="70" r="220" fill="#1a86aa" opacity="0.10"/>
  <circle cx="120" cy="830" r="260" fill="#2557a7" opacity="0.10"/>

  <text x="82" y="86" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">EXP-01 · ¿La implementación conserva y recupera el grafo?</text>
  <text x="84" y="126" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="21">Tres réplicas aisladas · fixture determinista · verificación contra oráculo independiente</text>

  <g filter="url(#shadow)">
    <rect x="80" y="175" width="930" height="375" rx="22" fill="#0d1b2a" stroke="#254359"/>
  </g>
  <text x="120" y="225" fill="#83ddf0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">MECANISMO ENSAYADO</text>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="115" y="285" width="150" height="116" rx="18" fill="#152b3d" stroke="#3484a2"/>
    <text x="190" y="326" fill="#f1f6fa" font-size="19" font-weight="700">Fixture STIX</text>
    <text x="190" y="358" fill="#a7bdcc" font-size="16">9 objetos</text>
    <text x="190" y="383" fill="#a7bdcc" font-size="16">10 relaciones · 17 prov.</text>

    <path d="M273 343 H330" stroke="#53c9e8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="340" y="285" width="150" height="116" rx="18" fill="#152b3d" stroke="#3484a2"/>
    <text x="415" y="326" fill="#f1f6fa" font-size="19" font-weight="700">Cola</text>
    <text x="415" y="358" fill="#a7bdcc" font-size="16">RabbitMQ</text>
    <text x="415" y="383" fill="#a7bdcc" font-size="16">1 mensaje</text>

    <path d="M498 343 H555" stroke="#53c9e8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="565" y="285" width="150" height="116" rx="18" fill="#152b3d" stroke="#3484a2"/>
    <text x="640" y="326" fill="#f1f6fa" font-size="19" font-weight="700">Worker</text>
    <text x="640" y="358" fill="#a7bdcc" font-size="16">procesa</text>
    <text x="640" y="383" fill="#a7bdcc" font-size="16">o se detiene</text>

    <path d="M723 343 H780" stroke="#53c9e8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="790" y="285" width="180" height="116" rx="18" fill="#152b3d" stroke="#3484a2"/>
    <text x="880" y="326" fill="#f1f6fa" font-size="19" font-weight="700">Grafo exportado</text>
    <text x="880" y="358" fill="#a7bdcc" font-size="16">API pública</text>
    <text x="880" y="383" fill="#a7bdcc" font-size="16">comparada al oráculo</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="120" y="455" width="254" height="58" rx="12" fill="#113326" stroke="#2dba78"/>
    <text x="247" y="480" text-anchor="middle" fill="#71e6a9" font-size="17" font-weight="700">IMPORTACIÓN NORMAL</text>
    <text x="247" y="501" text-anchor="middle" fill="#c5d7cf" font-size="14">grafo completo</text>
    <rect x="405" y="455" width="254" height="58" rx="12" fill="#312a12" stroke="#e2b944"/>
    <text x="532" y="480" text-anchor="middle" fill="#f5d66e" font-size="17" font-weight="700">REPLAY EXACTO</text>
    <text x="532" y="501" text-anchor="middle" fill="#dcd3b4" font-size="14">cero duplicados</text>
    <rect x="690" y="455" width="280" height="58" rx="12" fill="#1b2944" stroke="#6099ed"/>
    <text x="830" y="480" text-anchor="middle" fill="#8bb8ff" font-size="17" font-weight="700">WORKER APAGADO → ENCENDIDO</text>
    <text x="830" y="501" text-anchor="middle" fill="#c4d1e5" font-size="14">cola pendiente → grafo completo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="175" width="470" height="375" rx="22" fill="#0d1b2a" stroke="#254359"/>
  </g>
  <text x="1090" y="225" fill="#83ddf0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">RESULTADO AGREGADO</text>
  <text x="1090" y="315" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">3/3</text>
  <text x="1285" y="287" fill="#78e5a8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">RÉPLICAS PASS</text>
  <text x="1285" y="322" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="17">seis plataformas limpias</text>
  <line x1="1090" y1="355" x2="1480" y2="355" stroke="#284459"/>
  <text x="1090" y="410" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">9/9</text>
  <text x="1220" y="400" fill="#d6e4ed" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">condiciones puntuadas</text>
  <text x="1220" y="428" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="16">100% objetos · relaciones · procedencia</text>
  <rect x="1090" y="465" width="390" height="50" rx="12" fill="#113326" stroke="#2dba78"/>
  <text x="1285" y="497" text-anchor="middle" fill="#78e5a8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">0 faltantes · 0 inesperados · 0 duplicados</text>

  <g filter="url(#shadow)">
    <rect x="80" y="590" width="1440" height="230" rx="22" fill="#0d1b2a" stroke="#254359"/>
  </g>
  <text x="120" y="640" fill="#83ddf0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">TIEMPOS DESCRIPTIVOS DEL HOST</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="120" y="698" fill="#dce7ee" font-size="18">Importación normal</text>
    <rect x="350" y="678" width="790" height="28" rx="14" fill="#163149"/>
    <rect x="350" y="678" width="790" height="28" rx="14" fill="url(#cyan)"/>
    <text x="1170" y="699" fill="#f4f8fb" font-size="20" font-weight="700">52.901 s</text>
    <text x="1295" y="699" fill="#91a9ba" font-size="15">media, n=3</text>

    <text x="120" y="750" fill="#dce7ee" font-size="18">Replay exacto</text>
    <rect x="350" y="730" width="790" height="28" rx="14" fill="#163149"/>
    <rect x="350" y="730" width="20" height="28" rx="14" fill="#f0bf4e"/>
    <text x="1170" y="751" fill="#f4f8fb" font-size="20" font-weight="700">0.881 s</text>
    <text x="1295" y="751" fill="#91a9ba" font-size="15">media, n=3</text>

    <text x="120" y="802" fill="#dce7ee" font-size="18">Recuperación worker</text>
    <rect x="350" y="782" width="790" height="28" rx="14" fill="#163149"/>
    <rect x="350" y="782" width="151" height="28" rx="14" fill="#74d39a"/>
    <text x="1170" y="803" fill="#f4f8fb" font-size="20" font-weight="700">10.125 s</text>
    <text x="1295" y="803" fill="#91a9ba" font-size="15">media automática, n=2</text>
  </g>

  <text x="80" y="866" fill="#91a9ba" font-family="Inter, Arial, sans-serif" font-size="16">Alcance: prueba repetida de mecanismo para un grafo sintético; no es todavía una estimación de confiabilidad ni un benchmark de volumen.</text>
</svg>
