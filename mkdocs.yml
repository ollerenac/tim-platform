site_name: "TIM — Manual de Usuario"
site_description: "Guia de uso de la plataforma de Gestion de Inteligencia de Amenazas"
site_author: "TIM"
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Inicio: ONBOARDING.md
  - Operacion:
      - Despliegue por objetivos: despliegue-objetivos.md
      - Inspeccion de conectores: source-walkthroughs/connectors/00-README.md
  - Casos de uso:
      - APT39 - Remexi y MechaFlounder: casos-de-uso/apt39-remexi-mechaFlounder.md
  - Lecciones:
      - Indice: lecciones/00-README.md
      - Vocabulario y relojes: lecciones/01-vocabulario-relojes-y-senales.md
      - Catalogo de conectores: lecciones/02-connector-opencti-catalogo-de-referencia.md
      - Disarm: lecciones/03-disarm-y-el-problema-del-discriminador.md
      - CVE: lecciones/04-connector-cve-y-cierre-de-la-capa-1.md
      - AlienVault: lecciones/05-alienvault-y-la-apertura-de-la-capa-2.md
