server {
    listen 80;
    location = /healthz {
        access_log off;
        auth_basic off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers — the dashboard renders attacker-influenced threat-intel strings.
    # CSP is intentionally moderate so the Vite SPA still works (external module scripts =
    # script-src 'self'); tighten script-src if inline scripts are ever added.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Auth at the vhost level: one browser login covers the SPA and every /api/* proxy
    # (the SPA's same-origin fetches reuse the cached credentials). Reuses the existing
    # htpasswd so the dashboard and Kibana share one credential. Closes the "anyone who can
    # reach the host can read all intel / spawn LLM jobs" vector.
    auth_basic "TIM";
    auth_basic_user_file /etc/nginx/.kibana.htpasswd;

    # Backend proxies — browser talks HTTPS to nginx, nginx proxies over internal Docker network.
    # Upstreams are resolved per request through Docker's embedded DNS. A literal hostname in
    # proxy_pass is resolved once at startup: nginx then refuses to start while a backend is
    # down and keeps a stale IP once that backend restarts (VPS 2026-09-19: /api/feeds/
    # answered 502 after a host reboot). With a variable, proxy_pass no longer strips the
    # location prefix, so each block rewrites it away explicitly.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/feeds/ {
        set $feeds_upstream http://feed-orchestrator:8001;
        rewrite ^/api/feeds/(.*)$ /$1 break;
        proxy_pass $feeds_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/briefings/ {
        set $briefings_upstream http://briefing-generator:8003;
        rewrite ^/api/briefings/(.*)$ /$1 break;
        proxy_pass $briefings_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/extractor/ {
        set $extractor_upstream http://intel-extractor:8004;
        rewrite ^/api/extractor/(.*)$ /$1 break;
        proxy_pass $extractor_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 5602;

    auth_basic "TIM Kibana";
    auth_basic_user_file /etc/nginx/.kibana.htpasswd;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        # No prefix to strip: the request URI is passed as-is.
        set $kibana_upstream http://kibana:5601;
        proxy_pass $kibana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
